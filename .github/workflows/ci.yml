name: Enterprise QA Automation - CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Code Quality and Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install Allure CLI
        run: |
          npm install --global allure-commandline@2.46.1
          allure --version

      - name: Run Ruff
        run: ruff check .

      - name: Run automated tests
        run: python -m pytest --alluredir=reports/allure-results

      - name: Generate Allure HTML report
        if: always()
        run: allure generate reports/allure-results --clean -o reports/allure-report

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: reports/allure-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: reports/allure-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports/allure-report

  deploy-pages:
    name: Deploy Allure Report to GitHub Pages
    needs: quality-and-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
